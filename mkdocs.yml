site_name: Yi Zhou · 周毅
site_url: https://joey001.github.io/
site_author: Yi Zhou
site_description: Yi Zhou, Professor at UESTC. Combinatorial optimization, algorithm engineering, publications, teaching, and student opportunities.
nav:
  - Home:
      - 中文: index.md
      - English: index_en.md
  - Research:
      - Publications: research/publication.md
      - Relaxed Cliques: research/relaxcliquesolver/relaxedclique.md
      - Submodular Optimization: research/submodular/submax.md
  - My Team: aegroup/aegroup.md
  - Teaching（教学）: course/optimization.md
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
extra_css:
  - stylesheets/extra.css
plugins:
  - search:
      lang: [en, zh]
markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
